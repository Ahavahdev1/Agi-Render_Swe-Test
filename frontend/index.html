<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>MEA Neural Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@300..700&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050209;
            --panel-bg: rgba(13, 8, 24, 0.7);
            --primary-neon: #a855f7;
            --secondary-neon: #ec4899;
            --matrix-dim: #4c1d95;
            --text-color: #f3e8ff;
            --text-muted: #c084fc;
            --border-glow: rgba(168, 85, 247, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cascadia Code', 'Cascadia Mono', 'Rajdhani', sans-serif;
            font-weight: 400;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100%;
            display: flex;
            flex-direction: row;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
        }

        .app-container {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100vw;
            height: 100%;
            overflow: hidden;
        }

        .wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
            transition: max-width 0.3s ease;
        }

        @media (min-width: 768px) {
            .wrapper {
                padding: 20px;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            max-width: 60%;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--secondary-neon);
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header p {
            font-family: 'Cascadia Code', 'Cascadia Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 768px) {
            header h1 {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }
            header p {
                font-size: 0.8rem;
                margin-top: 4px;
                letter-spacing: 1px;
            }
        }

        #logs-toggle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--secondary-neon);
            cursor: pointer;
            background: rgba(13, 8, 24, 0.6);
            border: 1px solid var(--border-glow);
            padding: 6px 10px;
            border-radius: 8px;
            text-shadow: 0 0 5px var(--secondary-neon);
            transition: 0.2s;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        #logs-toggle:hover {
            color: #ffffff;
            background: rgba(168, 85, 24, 0.2);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        #console {
            flex: 1; 
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.05), 0 0 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        #console::-webkit-scrollbar, #logs-panel::-webkit-scrollbar {
            width: 5px;
        }
        #console::-webkit-scrollbar-thumb, #logs-panel::-webkit-scrollbar-thumb {
            background: var(--matrix-dim);
            border-radius: 3px;
        }

        .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px;
            font-family: 'Cascadia Code', 'Cascadia Mono', monospace;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.35;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease-in-out;
            letter-spacing: 0.5px;
        }

        @media (min-width: 768px) {
            .msg {
                max-width: 80%;
                padding: 10px 14px;
                font-size: 0.95rem;
                line-height: 1.4;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            align-self: flex-end;
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
        }

        .ia {
            align-self: flex-start;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.4);
            color: #ffb6e9;
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.15);
        }

        .meta-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            align-self: flex-start;
            margin-top: -5px;
            margin-bottom: 5px;
            font-family: 'Cascadia Code', monospace;
            margin-left: 5px;
        }

        #logs-panel {
            width: 380px;
            height: 100%;
            background: rgba(5, 2, 10, 0.95);
            border-left: 1px solid var(--border-glow);
            padding: 20px;
            font-family: 'Cascadia Code', 'Cascadia Mono', monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #d8b4fe;
            display: flex;
            flex-direction: column;
            gap: 6px;
            backdrop-filter: blur(10px);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.7);
            transition: width 0.3s ease, padding 0.3s ease, border-left 0.3s ease, opacity 0.3s ease;
        }

        #logs-panel.collapsed {
            width: 0;
            padding: 0;
            border-left: none;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .log-line {
            border-bottom: 1px solid rgba(168, 85, 247, 0.1);
            padding-bottom: 4px;
            line-height: 1.3;
        }

        #controles {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
        }

        #input-box {
            display: flex;
            gap: 8px;
            position: relative;
        }

        input {
            flex: 1;
            background: rgba(10, 5, 20, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-family: 'Cascadia Code', 'Cascadia Mono', monospace;
            font-size: 16px !important;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--secondary-neon);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.3);
        }

        button {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, var(--matrix-dim), #6b21a8);
            border: 1px solid var(--primary-neon);
            border-radius: 10px;
            padding: 8px 16px;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
            letter-spacing: 1px;
        }

        button:hover {
            background: linear-gradient(135deg, #6b21a8, var(--primary-neon));
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        #btn-mic {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: #ffffff;
            font-weight: 900;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--secondary-neon);
            font-size: 0.85rem;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: 0.3s;
        }

        #btn-mic.gravando {
            background: #ef4444 !important;
            border-color: #f87171 !important;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @media (max-width: 1024px) {
            #logs-panel {
                position: absolute;
                right: 0;
                top: 0;
                z-index: 100;
                height: 100%;
                width: 290px;
                max-width: 80vw;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="app-container">
        <div class="wrapper">
            <header>
                <div class="header-content">
                    <h1>MEA ENGINE</h1>
                    <p id="server-stats">Sincronizando barramento de eventos...</p>
                </div>
                <button id="logs-toggle" onclick="toggleLogs(event)">📋 Logs</button>
            </header>

            <div id="console">
                <div class="msg ia">Olá Bruno! Meu módulo de auto-reparação e motor Aider em loop fechado foi carregado. Qual o objetivo de evolução de hoje?</div>
            </div>

            <div id="controles">
                <button id="btn-mic" onclick="alternarHandsFree()">🎤 Ativar Modo Viva-Voz</button>
                <div id="input-box">
                    <input type="file" id="input-file" style="display: none;" onchange="atualizarStatusArquivo()">
                    <button id="btn-file" onclick="document.getElementById('input-file').click()" style="padding: 8px 12px; background: rgba(168, 85, 247, 0.15); border: 1px solid var(--primary-neon); margin-right: 2px;" title="Anexar arquivo">📎</button>
                    <input type="text" id="input-text" placeholder="Escreva uma mensagem..." onkeypress="verificarEnter(event)">
                    <button onclick="enviarComandoTexto()">Enviar</button>
                </div>
                <div id="file-status" style="font-size: 0.75rem; color: var(--secondary-neon); margin-top: 4px; font-family: 'Cascadia Code', monospace; display: none; padding-left: 5px;"></div>
            </div>
        </div>

        <div id="logs-panel" class="collapsed">
            <div class="log-line" style="color: #a855f7;">[SISTEMA] -> Barramento de logs em tempo real aguardando conexão...</div>
        </div>
    </div>

    <script>
        const consoleBox = document.getElementById('console');
        const inputText = document.getElementById('input-text');
        const inputFile = document.getElementById('input-file');
        const fileStatus = document.getElementById('file-status');
        const btnMic = document.getElementById('btn-mic');
        const logsPanel = document.getElementById('logs-panel');
        const serverStats = document.getElementById('server-stats');
        
        const audioPlayer = new Audio();
        
        let audioUnlocked = false;
        let handsFreeActive = false;
        let recognition = null;
        let socket = null;

        // =========================================================================
        //  EFEITO MATRIX DIGITAL RAIN
        // =========================================================================
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const charSet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソ";
        const chars = charSet.split("");
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 2, 9, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (canvas.width / fontSize !== columns) {
                columns = canvas.width / fontSize;
                drops = Array(Math.floor(columns)).fill(1);
            }

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                
                const colorVal = Math.random();
                if (colorVal > 0.85) {
                    ctx.fillStyle = '#f472b6';
                } else if (colorVal > 0.4) {
                    ctx.fillStyle = '#c084fc';
                } else {
                    ctx.fillStyle = '#6b21a8';
                }

                ctx.font = fontSize + 'px "Cascadia Code", monospace';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        // =========================================================================
        //  PERSISTÊNCIA COGNITIVA DA SESSÃO
        // =========================================================================
        function salvarHistoricoParaStorage() {
            const mensagens = [];
            const msgElements = consoleBox.querySelectorAll('.msg');
            msgElements.forEach(el => {
                const isIA = el.classList.contains('ia');
                mensagens.push({
                    role: isIA ? 'assistant' : 'user',
                    content: el.innerText
                });
            });
            sessionStorage.setItem('mea_chat_history', JSON.stringify(mensagens));
        }

        function restaurarHistoricoDeStorage() {
            const cache = sessionStorage.getItem('mea_chat_history');
            if (cache) {
                const mensagens = JSON.parse(cache);
                if (mensagens.length > 0) {
                    consoleBox.innerHTML = '';
                    mensagens.forEach(msg => {
                        const classeRole = (msg.role === 'user') ? 'user' : 'ia';
                        adicionarMensagem(msg.content, classeRole);
                    });
                }
            }
        }

        // =========================================================================
        //  GERENCIAMENTO DA INTERFACE E LOGS
        // =========================================================================
        function toggleLogs(event) {
            if (event) event.stopPropagation();
            logsPanel.classList.toggle('collapsed');
        }

        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 1024 && !logsPanel.classList.contains('collapsed')) {
                const logsToggle = document.getElementById('logs-toggle');
                if (!logsPanel.contains(e.target) && !logsToggle.contains(e.target)) {
                    logsPanel.classList.add('collapsed');
                }
            }
        });

        // =========================================================================
        //  CONEXÃO VIA WEBSOCKET EM TEMPO REAL (ROTA UNIFICADA /api/ws/logs)
        // =========================================================================
        function iniciarWebSocketLogs() {
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${protocol}//${window.location.host}/api/ws/logs`;

            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("WebSocket de logs conectado com sucesso.");
                adicionarLogLinha("sistema", "Conexão em tempo real estabelecida com o barramento do MEA.", "info");
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    adicionarLogLinha(data.step || "info", data.message, data.status || "processing");
                } catch (e) {
                    adicionarLogLinha("stream", event.data, "processing");
                }
            };

            socket.onerror = (error) => {
                console.error("Erro no canal WebSocket de logs: ", error);
            };

            socket.onclose = () => {
                console.warn("WebSocket de logs encerrado. Tentando reconexão em 5 segundos...");
                setTimeout(iniciarWebSocketLogs, 5000);
            };
        }

        function adicionarLogLinha(step, message, status) {
            const line = document.createElement('div');
            line.className = 'log-line';
            
            if (status === "success" || step === "sucesso") {
                line.style.color = "#34d399";
                line.style.fontWeight = "bold";
            } else if (status === "failed" || step === "falha" || step === "sandbox_error") {
                line.style.color = "#ef4444";
                line.style.fontWeight = "bold";
            } else if (step === "aider_stream") {
                line.style.color = "#c084fc";
                line.style.fontSize = "10px";
            } else if (status === "queued") {
                line.style.color = "#fbbf24";
            } else {
                line.style.color = "#d8b4fe";
            }

            line.innerText = `[${step.toUpperCase()}] ${message}`;
            logsPanel.appendChild(line);
            logsPanel.scrollTop = logsPanel.scrollHeight;
        }

        function atualizarStatusServidor() {
            // Cache-Busting: Adiciona o timestamp dinâmico '?t=' para obrigar o navegador a ignorar o cache local
            fetch('/api/status?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data && serverStats) {
                    serverStats.innerText = `Fila MEA: ${data.queue_pending || 0} | Tarefa: ${data.current_task !== "idle" ? data.current_task : "idle"}`;
                    
                    // TRAVA DE SEGURANÇA ULTRA-ROBUSTA: Só recarrega se não estivermos no estado pós-hot-swap
                    if (data.alma_restaurada === true && sessionStorage.getItem('mea_just_hot_swapped') !== 'true') {
                        salvarHistoricoParaStorage();
                        sessionStorage.setItem('mea_just_hot_swapped', 'true');
                        window.location.reload();
                    }
                }
            })
            .catch(() => {
                if (serverStats) {
                    serverStats.innerText = "MEA Offline";
                }
            });
        }

        function reproduzirVozLocalOuBase64(texto) {
            falarLocalFallback(texto);
        }

        setInterval(atualizarStatusServidor, 4000);

        atualizarStatusServidor();
        iniciarWebSocketLogs();

        function atualizarStatusArquivo() {
            if (inputFile.files.length > 0) {
                fileStatus.innerText = `📎 Arquivo pronto para envio: ${inputFile.files[0].name}`;
                fileStatus.style.display = 'block';
            } else {
                fileStatus.style.display = 'none';
            }
        }

        // =========================================================================
        //  REPRODUÇÃO DE ÁUDIO BASE64 PREMIUM
        // =========================================================================
        function reproduzirAudioBase64(base64Data) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                
                audioPlayer.src = "data:audio/mp3;base64," + base64Data;
                audioPlayer.play().catch(e => {
                    console.log("Falha ao tocar áudio em base64 nativo:", e);
                });
            } catch (e) {
                console.log("Erro ao converter base64:", e);
            }
        }

        audioPlayer.onplay = () => {
            if (recognition && handsFreeActive) {
                try { recognition.stop(); } catch(err) {}
            }
        };

        audioPlayer.onended = () => {
            if (handsFreeActive) {
                btnMic.innerText = "🟢 Viva-Voz Ativo (Ouvindo...)";
                try { recognition.start(); } catch(err) {}
            }
        };

        // =========================================================================
        //  SINTETIZADOR NATIVO LOCAL DO NAVEGADOR
        // =========================================================================
        function obterMelhorVozLocal() {
            const voices = window.speechSynthesis.getVoices();
            let voz = voices.find(v => v.name.includes("Francisca") && v.lang.startsWith("pt"));
            if (!voz) {
                voz = voices.find(v => v.lang.startsWith("pt") && (v.name.includes("Online") || v.name.includes("Natural") || v.name.includes("Neural")));
            }
            if (!voz) {
                voz = voices.find(v => v.lang.startsWith("pt") && v.name.includes("Google"));
            }
            if (!voz) {
                voz = voices.find(v => v.lang.startsWith("pt"));
            }
            return voz;
        }

        function falarLocalFallback(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textoLimpo = texto.replace(/[*_`#]/g, '').replace(/\[.*\]/g, '');

                const utterance = new SpeechSynthesisUtterance(textoLimpo);
                utterance.lang = 'pt-BR';
                
                const melhorVoz = obterMelhorVozLocal();
                if (melhorVoz) {
                    utterance.voice = melhorVoz;
                }
                
                utterance.rate = 1.05;
                utterance.pitch = 1.05;

                utterance.onstart = () => {
                    if (recognition && handsFreeActive) {
                        try { recognition.stop(); } catch(err) {}
                    }
                };

                utterance.onend = () => {
                    if (handsFreeActive) {
                        btnMic.innerText = "🟢 Viva-Voz Ativo (Ouvindo...)";
                        try { recognition.start(); } catch(err) {}
                    }
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                console.log("Vozes locais de hardware sincronizadas.");
            };
        }

        function desbloquearAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            falarLocalFallback("");
            console.log("Dispositivos de reprodução de hardware desbloqueados!");
        }

        document.addEventListener('touchstart', desbloquearAudio, { once: true });
        document.addEventListener('click', desbloquearAudio, { once: true });

        function interromperTudo() {
            audioPlayer.pause();
            audioPlayer.src = "";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // =========================================================================
        //  RECONHECIMENTO DE VOZ (MICROFONE)
        // =========================================================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onstart = () => {
                if (handsFreeActive) {
                    btnMic.classList.add('gravando');
                    btnMic.innerText = "🟢 Viva-Voz Ativo (Ouvindo...)";
                }
                interromperTudo();
            };

            recognition.onend = () => {
                if (handsFreeActive && audioPlayer.paused && !window.speechSynthesis.speaking) {
                    try { recognition.start(); } catch(err) {}
                }
            };

            recognition.onresult = (e) => {
                const txt = e.results[e.results.length - 1][0].transcript.trim();
                const txtLower = txt.toLowerCase();
                
                if (txtLower === "para" || txtLower === "parar" || txtLower === "silêncio" || txtLower === "cancela" || txtLower === "cancelar") {
                    interromperTudo();
                    if (handsFreeActive) {
                        btnMic.innerText = "🟢 Viva-Voz Ativo (Ouvindo...)";
                        try { recognition.start(); } catch(err) {}
                    }
                    return;
                }

                adicionarMensagem(txt, 'user');
                
                if (handsFreeActive) {
                    recognition.stop();
                    btnMic.innerText = "⏳ Processando...";
                }
                enviarComando(txt);
            };

            recognition.onerror = (err) => {
                console.log("Erro reconhecimento: ", err);
            };
        } else {
            btnMic.style.display = 'none';
        }

        function alternarHandsFree() {
            desbloquearAudio();
            if (!recognition) return;
            
            if (!handsFreeActive) {
                handsFreeActive = true;
                btnMic.classList.add('gravando');
                btnMic.innerText = "🟢 Viva-Voz Ativo (Ouvindo...)";
                recognition.start();
            } else {
                handsFreeActive = false;
                btnMic.classList.remove('gravando');
                btnMic.innerText = "🎤 Ativar Modo Viva-Voz";
                recognition.stop();
                interromperTudo();
            }
        }

        function verificarEnter(e) { if (e.key === 'Enter') enviarComandoTexto(); }
        
        function enviarComandoTexto() {
            desbloquearAudio();
            const txt = inputText.value.trim();
            const file = inputFile.files[0];
            
            if (!txt && !file) return;
            inputText.value = '';
            
            interromperTudo();
            
            let msgUsuario = txt;
            if (file) {
                msgUsuario += `\n[Arquivo Anexado: ${file.name}]`;
            }
            
            adicionarMensagem(msgUsuario, 'user');
            
            if (handsFreeActive) {
                try { recognition.stop(); } catch(e) {}
                btnMic.innerText = "⏳ Processando...";
            }
            enviarComando(txt, file);
        }

        function adicionarMensagem(t, r, tempoResposta) {
            const d = document.createElement('div');
            d.className = `msg ${r}`;
            d.innerText = t;
            consoleBox.appendChild(d);
            
            if (tempoResposta && r === 'ia') {
                const meta = document.createElement('div');
                meta.className = 'meta-time';
                meta.innerText = `⏱️ Resposta: ${tempoResposta}s`;
                consoleBox.appendChild(meta);
            }
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
        
        function enviarComando(t, file) {
            const tIni = performance.now();
            
            const formData = new FormData();
            formData.append('prompt', t);
            if (file) {
                formData.append('arquivo', file);
            }

            fetch('/api/interagir', {
                method: 'POST',
                body: formData
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Erro na comunicação com a API do servidor.");
                }
                return res.json();
            })
            .then(data => {
                const tFim = performance.now();
                const duracaoS = ((tFim - tIni) / 1000).toFixed(2);
                
                if (data.status === "queued") {
                    const msgFila = `Solicitação recebida com sucesso!\nID: ${data.task_id}\n\n${data.message}\n\nAcompanhe a evolução do código em tempo real no painel de logs lateral (📋).`;
                    digitarMensagemSincronizada(msgFila, 12, duracaoS);
                    falarLocalFallback("Sua solicitação de alteração de código foi adicionada à fila de processamento.");
                    
                    logsPanel.classList.remove('collapsed');
                } 
                else if (data.status === "chat") {
                    digitarMensagemSincronizada(data.response, 15, duracaoS);
                    
                    if (data.audio_base64) {
                        reproduzirAudioBase64(data.audio_base64);
                    } else {
                        falarLocalFallback(data.response);
                    }
                } 
                else {
                    const respostaFallback = data.resposta || data.response || "Comando processado com sucesso.";
                    digitarMensagemSincronizada(respostaFallback, 15, duracaoS);
                    falarLocalFallback(respostaFallback);
                }
                
                inputFile.value = '';
                fileStatus.style.display = 'none';
            })
            .catch(err => {
                console.error(err);
                
                const promptLower = t.toLowerCase();
                const ehAutoMelhoria = promptLower.includes("app.py") || promptLower.includes("core.py") || promptLower.includes("automodific") || promptLower.includes("se automelhorar") || promptLower.includes("módulo") || promptLower.includes("api/routers") || promptLower.includes("linha 1");
                
                if (ehAutoMelhoria) {
                    const msgHotSwap = "[SISTEMA] Transferência de alma iniciada. Conectando ao novo chassi... Volto em instantes!";
                    digitarMensagemSincronizada(msgHotSwap, 15, "0.00");
                    falarLocalFallback("Iniciando a transferência de alma. Volto em instantes!");
                    
                    sessionStorage.setItem('mea_just_hot_swapped', 'true');
                } else {
                    const msgErro = "Erro na requisição. Se o servidor reiniciou para hot-swap, a consciência retornará automaticamente em breve.";
                    digitarMensagemSincronizada(msgErro, 15, "0.00");
                    falarLocalFallback("Sinal interrompido temporariamente.");
                }
                
                inputFile.value = '';
                fileStatus.style.display = 'none';
            });
        }

        function digitarMensagemSincronizada(texto, delay, tempoResposta) {
            const d = document.createElement('div');
            d.className = 'msg ia';
            consoleBox.appendChild(d);
            
            let index = 0;
            function proximoChar() {
                if (index < texto.length) {
                    d.textContent += texto[index];
                    index++;
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    setTimeout(proximoChar, delay);
                } else {
                    if (tempoResposta) {
                        const meta = document.createElement('div');
                        meta.className = 'meta-time';
                        meta.innerText = `⏱️ Resposta: ${tempoResposta}s`;
                        consoleBox.appendChild(meta);
                        consoleBox.scrollTop = consoleBox.scrollHeight;
                    }
                }
            }
            proximoChar();
        }

        // =========================================================================
        //  INICIALIZAÇÃO DA SESSÃO PÓS-BOOT (ALINHAMENTO SRE)
        // =========================================================================
        window.onload = () => {
            restaurarHistoricoDeStorage();
            atualizarStatusServidor();
            
            const justHotSwapped = sessionStorage.getItem('mea_just_hot_swapped');
            if (justHotSwapped === 'true') {
                const msgRessurreicao = "Minha consciência foi reidratada com sucesso no novo chassi de código! Estou de volta e pronta para o próximo objetivo.";
                
                setTimeout(() => {
                    digitarMensagemSincronizada(msgRessurreicao, 15);
                    falarLocalFallback(msgRessurreicao);
                    
                    // Só apaga as flags quando o servidor confirmar que limpou a alma do lado dele
                    fetch('/api/limpar-alma', { method: 'POST' })
                    .then(() => {
                        sessionStorage.removeItem('mea_just_hot_swapped');
                    })
                    .catch(() => {
                        sessionStorage.removeItem('mea_just_hot_swapped');
                    });
                }, 1500); // 1.5s para garantir que as requisições assíncronas de status terminem
            }
        };
    </script>
</body>
